<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>宁博自习室价格计算器</title>
    <link rel="stylesheet" href="style.css" id="styleLink">
</head>
<body>
    <!-- 价目表弹窗 -->
    <div id="priceListModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>价目表</h2>
                <button class="modal-close" id="closeModal">&times;</button>
            </div>
            <div class="modal-body">
                <div id="priceTable"></div>
            </div>
        </div>
    </div>
    
    <!-- 座位图弹窗 -->
    <div id="seatMapModal" class="modal hidden">
        <div class="modal-content seat-map-modal">
            <div class="modal-header">
                <h2>座位图</h2>
                <button class="modal-close" id="closeSeatMapModal">&times;</button>
            </div>
            <div class="seat-map-body">
                <div class="floor-tabs">
                    <button class="floor-tab active" data-floor="2层">2层</button>
                    <button class="floor-tab" data-floor="3层">3层</button>
                </div>
                <div class="seat-map-container">
                    <canvas id="seatMapCanvas"></canvas>
                </div>
            </div>
        </div>
    </div>
    
    <div class="container">
        <div class="header-with-btn">
            <h1>宁博自习室价格计算器</h1>
            <button id="seatMapBtn" class="seat-map-btn" title="查看座位图">座位图</button>
        </div>
        
        <div class="form-group">
            <label for="seatType">座位类型</label>
            <select id="seatType">
                <option value="">请选择座位类型</option>
            </select>
        </div>

        <div class="form-group">
            <label for="durationType">时长类型</label>
            <select id="durationType">
                <option value="">请选择时长类型</option>
            </select>
        </div>

        <div class="form-group">
            <label for="startDate">起始日期</label>
            <input type="date" id="startDate">
        </div>

        <div class="form-group">
            <label for="endDate">结束日期</label>
            <input type="date" id="endDate">
        </div>

        <div class="form-group button-group">
            <button id="priceListBtn" class="price-list-btn" title="查看价目表">价目表</button>
            <button id="calculateBtn" class="btn-primary">计算价格</button>
        </div>

        <div id="result" class="result hidden">
            <h2>计算结果</h2>
            <div class="result-content">
                <p><strong>座位类型：</strong><span id="resultSeatType"></span></p>
                <p><strong>时长类型：</strong><span id="resultDurationType"></span></p>
                <p><strong>起始日期：</strong><span id="resultStartDate"></span></p>
                <p><strong>结束日期：</strong><span id="resultEndDate"></span></p>
                <p><strong>总天数：</strong><span id="resultDays"></span> 天</p>
                
                <div id="priceDetail" class="price-detail hidden">
                    <p><strong>费用明细：</strong></p>
                    <p class="detail-item" id="basePeriodItem">• <span id="basePeriodPrice"></span>（<span id="basePeriodName"></span>）</p>
                    <p class="detail-item" id="extraDaysItem">• <span id="extraDaysPrice"></span>（超出 <span id="extraDays"></span> 天，按照<span id="extraDurationName"></span>价格，每天 <span id="dailyPrice"></span> 元）</p>
                    <p class="detail-item" id="lessDaysItem">• 实际使用 <span id="actualDays"></span> 天，按照<span id="lessDurationName"></span>价格，每天 <span id="lessDailyPrice"></span> 元计算</p>
                </div>
                
                <p class="price"><strong>总价格：</strong><span id="resultPrice"></span> 元</p>
            </div>
        </div>

        <div class="version-info">
            <span id="version">加载中...</span>
        </div>
    </div>

    <script>
        // 动态添加版本号参数防止缓存
        (function() {
            const version = 'v0.0.8';
            const versionParam = version.replace('v', '').replace(/\./g, '');
            const timestamp = new Date().getTime();
            
            // 更新 CSS 链接
            const styleLink = document.getElementById('styleLink');
            if (styleLink) {
                styleLink.href = `style.css?v=${versionParam}&t=${timestamp}`;
            }
            
            // 动态加载 JS
            const script = document.createElement('script');
            script.src = `script.js?v=${versionParam}&t=${timestamp}`;
            document.body.appendChild(script);
        })();
    </script>
</body>
</html>
