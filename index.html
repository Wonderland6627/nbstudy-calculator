<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宁博自习室价格计算器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 价目表弹窗 -->
    <div id="priceListModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>价目表</h2>
                <button class="modal-close" id="closeModal">&times;</button>
            </div>
            <div class="modal-body">
                <div id="priceTable"></div>
            </div>
        </div>
    </div>
    
    <div class="container">
        <div class="header-with-btn">
            <h1>宁博自习室价格计算器</h1>
            <button id="priceListBtn" class="price-list-btn" title="查看价目表">价目表</button>
        </div>
        
        <div class="form-group">
            <label for="seatType">座位类型</label>
            <select id="seatType">
                <option value="">请选择座位类型</option>
            </select>
        </div>

        <div class="form-group">
            <label for="durationType">时长类型</label>
            <select id="durationType">
                <option value="">请选择时长类型</option>
            </select>
        </div>

        <div class="form-group">
            <label for="startDate">起始日期</label>
            <input type="date" id="startDate">
        </div>

        <div class="form-group">
            <label for="endDate">结束日期</label>
            <input type="date" id="endDate">
        </div>

        <div class="form-group">
            <button id="calculateBtn" class="btn-primary">计算价格</button>
        </div>

        <div id="result" class="result hidden">
            <h2>计算结果</h2>
            <div class="result-content">
                <p><strong>座位类型：</strong><span id="resultSeatType"></span></p>
                <p><strong>时长类型：</strong><span id="resultDurationType"></span></p>
                <p><strong>起始日期：</strong><span id="resultStartDate"></span></p>
                <p><strong>结束日期：</strong><span id="resultEndDate"></span></p>
                <p><strong>总天数：</strong><span id="resultDays"></span> 天</p>
                
                <div id="priceDetail" class="price-detail hidden">
                    <p><strong>费用明细：</strong></p>
                    <p class="detail-item">• <span id="basePeriodPrice"></span>（<span id="basePeriodName"></span>）</p>
                    <p class="detail-item">• <span id="extraDaysPrice"></span>（超出 <span id="extraDays"></span> 天，按照<span id="extraDurationName"></span>价格，每天 <span id="dailyPrice"></span> 元）</p>
                </div>
                
                <p class="price"><strong>总价格：</strong><span id="resultPrice"></span> 元</p>
            </div>
        </div>

        <div class="version-info">
            <span id="version">v0.0.1</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
